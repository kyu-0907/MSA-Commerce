spring:
  datasource:
    url: jdbc:mysql://localhost:3310/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: paymentuser
    password: paymentpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

kafka:
  bootstrap-servers: localhost:9092
