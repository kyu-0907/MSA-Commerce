version: '3.8'

services:
  mysql-auth:
    image: mysql:8.0
    container_name: auth-mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=authdb
      - MYSQL_USER=authuser
      - MYSQL_PASSWORD=authpass
    ports:
      - "3311:3306"
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-auth:
    image: redis:7.2-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-server-app
    ports:
      - "8088:8088"
    depends_on:
      mysql-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
    networks:
      - auth-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-auth:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_USERNAME=authuser
      - SPRING_DATASOURCE_PASSWORD=authpass
      # 필요 시 Redis 설정 추가 (포트 및 호스트)
      - SPRING_DATA_REDIS_HOST=redis-auth
      - SPRING_DATA_REDIS_PORT=6379

networks:
  auth-network:
    driver: bridge
