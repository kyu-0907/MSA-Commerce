server:
  port: 8088

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:mysql://mysql-auth:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: authuser
    password: authpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: redis-auth
      port: 6379

jwt:
  secret: msa-practice-auth-server-jwt-secret-key-must-be-long-enough-for-hs256
  expiration: 3600000  # 1 hour

mail:
  verification:
    code-ttl-seconds: 300      # 5분
    verified-ttl-seconds: 1800 # 30분
