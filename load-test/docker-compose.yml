services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: loadtest-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - loadtest-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: loadtest-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - loadtest-network

  # 상시 기동 대상이 아니라 필요할 때만 실행하는 실행형 서비스입니다.
  # `docker compose up` 만으로는 시작되지 않고, `docker compose run --rm k6 run <script>` 형태로 사용합니다.
  k6:
    image: grafana/k6:0.54.0
    container_name: loadtest-k6
    profiles: ["tools"]
    depends_on:
      - prometheus
    environment:
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./k6:/scripts
    working_dir: /scripts
    networks:
      - loadtest-network

networks:
  loadtest-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
